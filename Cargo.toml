[workspace]
members = [
    "crates/wmc-app",
    "crates/wmc-assets",
    "crates/wmc-controls",
    "crates/wmc-core",
    "crates/wmc-library",
    "crates/wmc-motion",
    "crates/wmc-player",
    "crates/wmc-ui",
]
default-members = ["crates/wmc-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Workspace crates.
wmc-assets = { path = "crates/wmc-assets" }
wmc-controls = { path = "crates/wmc-controls" }
wmc-core = { path = "crates/wmc-core" }
wmc-library = { path = "crates/wmc-library" }
wmc-motion = { path = "crates/wmc-motion" }
wmc-player = { path = "crates/wmc-player" }
wmc-ui = { path = "crates/wmc-ui" }

# Third-party versions and default-feature policies; crates select their features.
ab_glyph = "0.2.32"
aes = "0.8"
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false }
dirs = "=5.0.1"
embed-resource = "=3.0.12"
flate2 = "1"
fontdue = "=0.9.3"
# Used directly only to enable headless control tests without styled components.
gpui-base = "=0.7.3"
# Base is always available; styled components and bundled assets stay opt-in.
gpui-kit = { version = "=0.7.3", default-features = false }
image = { version = "0.25.10", default-features = false }
kamadak-exif = "0.6.1"
lofty = "=0.25.4"
md-5 = "0.10"
rodio = { version = "=0.21.1", default-features = false }
roxmltree = "0.21"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "=3.27.0"
unicode-segmentation = "1.12"
ureq = { version = "3.4", default-features = false }
url = "2"
volumecontrol = "=0.1.4"
walkdir = "2"
windows = "0.62.2"
windows-registry = "0.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "limited"

# Optimize image and text rendering dependencies during development.
[profile.dev.package.fontdue]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.release]
opt-level = 3
# Trade build speed for cross-crate optimization and a smaller executable.
lto = true
codegen-units = 1
panic = "abort"
strip = true
