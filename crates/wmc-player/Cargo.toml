[package]
name = "wmc-player"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wmc-assets.workspace = true
wmc-controls.workspace = true
wmc-core.workspace = true
wmc-motion.workspace = true

ab_glyph.workspace = true
aes.workspace = true
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
flate2.workspace = true
gpui-kit.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp"] }
lofty.workspace = true
md-5.workspace = true
rodio = { workspace = true, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-wav",
    "symphonia-pcm",
    "symphonia-flac",
    "symphonia-vorbis",
    "symphonia-isomp4",
    "symphonia-aac",
] }
roxmltree.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
unicode-segmentation.workspace = true
ureq = { workspace = true, features = [
    "rustls",
    "gzip",
    "platform-verifier",
] }
url.workspace = true

[dev-dependencies]
fontdue.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
volumecontrol.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage_Streams",
] }
windows-registry.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Media_Control"] }

[lints]
workspace = true

